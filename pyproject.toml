[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omarchy-voice"
version = "0.1.0"
description = "Local-first, permission-gated desktop voice commands"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
stt = ["faster-whisper>=1.1,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
omarchy-voice = "omarchy_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omarchy_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
