[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omarchy-voice"
version = "0.1.0"
description = "Local-first, permission-gated desktop voice commands"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# PyAV >= 19 removed the `metadata_errors` argument that faster-whisper < 2.0
# still passes to `av.open()`; pin it until faster-whisper moves past 1.2.x.
stt = ["faster-whisper>=1.1,<2", "av<19"]
test = ["pytest>=8,<10"]

[project.scripts]
omarchy-voice = "omarchy_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omarchy_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
